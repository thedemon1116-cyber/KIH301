<title>팀 할 일 목록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --primary: #3b82f6;
  --primary-text: #ffffff;
  --danger: #ef4444;
  --warn: #d97706;
  --star: #f59e0b;
  --group-bg: #eef3fd;
  --ok: #16a34a;
  --doing-bg: #dbeafe;
  --ok-bg: #dcfce7;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --border: #334155;
    --primary: #60a5fa;
    --primary-text: #0f172a;
    --danger: #f87171;
    --warn: #fbbf24;
    --star: #fbbf24;
    --group-bg: #243349;
    --ok: #4ade80;
    --doing-bg: #1e3a5f;
    --ok-bg: #14532d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --border: #334155;
    --primary: #60a5fa;
    --primary-text: #0f172a;
    --danger: #f87171;
    --warn: #fbbf24;
    --star: #fbbf24;
    --group-bg: #243349;
    --ok: #4ade80;
    --doing-bg: #1e3a5f;
    --ok-bg: #14532d;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.app {
  max-width: 600px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
}

h1 { margin: 0 0 20px; font-size: 1.6rem; }

.todo-form { display: flex; gap: 8px; }

.todo-form input,
.todo-list .edit {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1rem;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

.todo-form input:focus,
.todo-list .edit:focus { border-color: var(--primary); }

button {
  font: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

.todo-form button {
  padding: 10px 18px;
  border-radius: 10px;
  background: var(--primary);
  color: var(--primary-text);
  font-weight: 600;
}

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; }

.filters button {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.9rem;
}

.filters button.active {
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}

.todo-list { list-style: none; margin: 0; padding: 0; }

.todo-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
}

.todo-list input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--primary);
  flex-shrink: 0;
}

.todo-list .text {
  flex: 1;
  min-width: 0;
  word-break: keep-all;
  overflow-wrap: anywhere;
  cursor: text;
}

.todo-list li.done .text {
  text-decoration: line-through;
  color: var(--muted);
}

.todo-list .delete {
  color: var(--muted);
  font-size: 1.2rem;
  line-height: 1;
  padding: 4px 8px;
  border-radius: 6px;
}

.todo-list .delete:hover { color: var(--danger); }

.empty { text-align: center; color: var(--muted); padding: 24px 0; margin: 0; }

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  color: var(--muted);
  font-size: 0.9rem;
}

.footer button:hover { color: var(--danger); }

.hint { margin: 16px 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }

/* 마감일 입력 */
.todo-form { flex-wrap: wrap; }

.todo-form input[type="date"] {
  flex: 0 0 auto;
  color: var(--muted);
}

/* 드래그 손잡이 */
.todo-list .handle {
  color: var(--muted);
  cursor: grab;
  padding: 4px 2px;
  touch-action: none;
  user-select: none;
  flex-shrink: 0;
}

.todo-list li.dragging {
  opacity: 0.5;
  background: var(--bg);
}

body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }

/* 중요 표시 */
.todo-list .star {
  font-size: 1.2rem;
  line-height: 1;
  color: var(--muted);
  padding: 4px;
  flex-shrink: 0;
}

.todo-list li.important .star { color: var(--star); }
.todo-list li.important { box-shadow: inset 3px 0 0 var(--star); }

/* 마감일 배지 */
.todo-list .due {
  font-size: 0.8rem;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.todo-list .due.empty-due { opacity: 0; }
.todo-list li:hover .due.empty-due,
.todo-list .due.empty-due:focus { opacity: 1; }
.todo-list .due.today { border-color: var(--warn); color: var(--warn); font-weight: 600; }
.todo-list .due.overdue { border-color: var(--danger); color: var(--danger); font-weight: 600; }
.todo-list li.done .due { color: var(--muted); border-color: var(--border); font-weight: normal; }

.todo-list .due-edit {
  font-size: 0.8rem;
  padding: 2px 4px;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--primary);
  border-radius: 6px;
}

@media (hover: none) {
  .todo-list .due.empty-due { opacity: 1; }
}

/* 좁은 화면(휴대폰)에서는 입력칸을 한 줄 전체로 */
@media (max-width: 480px) {
  body { padding-block: 16px; }
  .app { padding: 18px 14px; }
  #todo-input { flex-basis: 100%; }
  .todo-form input[type="date"] { flex: 1; }
  .todo-list li { gap: 6px; }
}

/* 실 › 팀 입력칸 */
.group-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-basis: 100%;
  min-width: 0;
}

.group-inputs .sep { color: var(--muted); }
.todo-form input:disabled { opacity: 0.5; }

/* 그룹(실/팀) */
.todo-list ul { list-style: none; margin: 0; padding: 0; }

.group { margin-top: 10px; }
.group.lv2 { margin-left: 18px; margin-top: 6px; }

.group-head {
  display: flex;
  align-items: center;
  gap: 4px;
  border-radius: 10px;
}

.group.lv1 > .group-head { background: var(--group-bg); }
.group.lv2 > .group-head { border-bottom: 1px dashed var(--border); border-radius: 0; }

.group-toggle {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  text-align: left;
}

.group.lv1 .group-toggle { font-weight: 700; }
.group.lv2 .group-toggle { font-weight: 600; font-size: 0.95rem; }

.group-toggle .caret {
  display: inline-block;
  width: 1em;
  color: var(--muted);
  transition: transform 0.15s;
}

.group.collapsed > .group-head .caret { transform: rotate(-90deg); }
.group.collapsed > .group-body { display: none; }

.group-toggle .name { word-break: keep-all; overflow-wrap: anywhere; }

.group-toggle .tag {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 4px;
  padding: 0 4px;
  flex-shrink: 0;
}

.group-toggle .group-count {
  margin-left: auto;
  font-size: 0.8rem;
  font-weight: normal;
  color: var(--muted);
  white-space: nowrap;
}

.group-action {
  color: var(--muted);
  padding: 6px 8px;
  border-radius: 6px;
  flex-shrink: 0;
}

.group-action:hover { color: var(--primary); }

.group-head .rename-input {
  flex: 1;
  min-width: 0;
  margin: 4px 6px;
  padding: 6px 8px;
  font: inherit;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--primary);
  border-radius: 8px;
}

.group-body { padding-left: 8px; }

@media (prefers-reduced-motion: reduce) {
  .group-toggle .caret { transition: none; }
}

/* 할 일 본문 (제목 + 상태/마감일/파일 줄) */
.todo-list .item-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.todo-list .meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.todo-list .meta .due { padding: 1px 8px; font-size: 0.75rem; }
.todo-list .clip { font-size: 0.75rem; color: var(--muted); }

/* 진행 상태 배지 */
.status {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  white-space: nowrap;
}

.status.todo { color: var(--muted); border: 1px solid var(--border); }
.status.doing { color: var(--primary); background: var(--doing-bg); border: 1px solid transparent; }
.status.done { color: var(--ok); background: var(--ok-bg); border: 1px solid transparent; }

/* 작성하기 버튼 */
.todo-list .write {
  font-size: 0.8rem;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
}

.todo-list .write:hover { border-color: var(--primary); color: var(--primary); }

/* 작성하기 창 */
.detail {
  width: min(560px, calc(100% - 32px));
  max-height: calc(100% - 48px);
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--card);
  color: var(--text);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.detail::backdrop { background: rgba(15, 23, 42, 0.45); }

.detail-inner { display: flex; flex-direction: column; gap: 18px; padding: 22px; }

.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.detail-heading { flex: 1; min-width: 0; }
.detail-path { margin: 0 0 4px; font-size: 0.8rem; color: var(--muted); }
.detail-head h2 {
  margin: 0;
  font-size: 1.2rem;
  word-break: keep-all;
  overflow-wrap: anywhere;
  text-wrap: balance;
}

.detail-close {
  font-size: 1.5rem;
  line-height: 1;
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 8px;
}

.detail-close:hover { color: var(--text); }

.detail-state { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.detail-state .status { font-size: 0.85rem; padding: 3px 12px; }
.detail-done { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
.detail-done input { width: 18px; height: 18px; accent-color: var(--ok); }

.detail-section { display: flex; flex-direction: column; gap: 8px; }

.section-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.detail textarea {
  width: 100%;
  resize: vertical;
  min-height: 140px;
  padding: 12px;
  font: inherit;
  line-height: 1.6;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

.detail textarea:focus { border-color: var(--primary); }

.detail-saved { margin: 0; font-size: 0.75rem; color: var(--muted); }

.detail-files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

.detail-files li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.detail-files li.no-files { color: var(--muted); font-size: 0.85rem; border-style: dashed; }

.file-name {
  flex: 1;
  min-width: 0;
  text-align: left;
  color: var(--primary);
  overflow-wrap: anywhere;
}

.file-name:hover { text-decoration: underline; }
.file-info { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.file-delete { color: var(--muted); font-size: 1.1rem; padding: 0 6px; }
.file-delete:hover { color: var(--danger); }

.upload-button {
  align-self: flex-start;
  padding: 8px 16px;
  border-radius: 10px;
  background: var(--primary);
  color: var(--primary-text);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
}

.upload-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload-button:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }

.detail-error { margin: 0; font-size: 0.8rem; color: var(--danger); }
.detail-error:empty { display: none; }

button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

@media (max-width: 480px) {
  .detail { width: 100%; max-width: 100%; max-height: 100%; height: 100%; border-radius: 0; margin: 0; }
  .detail-inner { padding: 18px 16px; }
  .file-info { display: none; }
  .todo-list .write { padding: 5px 8px; }
}

[hidden] { display: none !important; }

/* 팀 공유판에만 있는 요소 */
.banner {
  margin: 0 0 16px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--doing-bg);
  color: var(--text);
  font-size: 0.9rem;
}

.import-box {
  margin: 0 0 16px;
  padding: 12px 14px;
  border: 1px dashed var(--primary);
  border-radius: 10px;
  font-size: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.import-box p { margin: 0; }
.import-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.import-actions button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); }
.import-actions .primary-small { background: var(--primary); color: var(--primary-text); border-color: transparent; font-weight: 600; }

/* 보기 전용 */
body.readonly .write-only { display: none !important; }
.todo-list button:disabled { cursor: default; }
.todo-list .due:disabled { opacity: 1; }

/* 지우기 확인 */
.confirm-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  margin: 6px 0;
  border: 1px solid var(--danger);
  border-radius: 10px;
  font-size: 0.85rem;
  list-style: none;
}

.confirm-bar span { flex: 1 1 200px; }
.confirm-bar button { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); }
.confirm-bar .confirm-yes { background: var(--danger); color: var(--card); border-color: transparent; font-weight: 600; }

/* 첨부 */
.file-icon { flex-shrink: 0; }
a.file-name { text-decoration: none; }
a.file-name:hover { text-decoration: underline; }

.attach-actions { display: flex; flex-direction: column; gap: 10px; }
.upload-button.busy { opacity: 0.6; pointer-events: none; }
.upload-button.busy::after { content: " (올리는 중…)"; }

.link-form { display: flex; flex-wrap: wrap; gap: 6px; }

.link-form input {
  flex: 1 1 160px;
  min-width: 0;
  padding: 8px 10px;
  font: inherit;
  font-size: 0.9rem;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
}

.link-form input:focus { border-color: var(--primary); }
.link-form button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--primary); color: var(--primary); font-weight: 600; font-size: 0.9rem; }
.detail-hint { margin: 0; font-size: 0.75rem; color: var(--muted); line-height: 1.5; }

@media (max-width: 480px) {
  .file-info { display: inline; font-size: 0.7rem; white-space: normal; text-align: right; }
}

</style>
  <main class="app">
    <h1>팀 할 일 목록</h1>
    <p id="banner" class="banner" role="status" hidden></p>

    <div id="import-box" class="import-box" hidden>
      <p id="import-text"></p>
      <div class="import-actions">
        <button type="button" id="import-button" class="primary-small">공유 목록으로 옮기기</button>
        <button type="button" id="import-dismiss">옮기지 않기</button>
      </div>
    </div>

    <form id="todo-form" class="todo-form write-only">
      <div class="group-inputs">
        <input id="dept-input" type="text" list="dept-options" placeholder="실 (예: 회원관리)" autocomplete="off" maxlength="40" title="상위 그룹 (선택)">
        <span class="sep" aria-hidden="true">›</span>
        <input id="team-input" type="text" list="team-options" placeholder="팀 (예: 이용율 관리)" autocomplete="off" maxlength="40" title="하위 그룹 (선택, 실을 먼저 입력)" disabled>
      </div>
      <datalist id="dept-options"></datalist>
      <datalist id="team-options"></datalist>
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" maxlength="200" required>
      <input id="due-input" type="date" title="마감일 (선택)">
      <button type="submit">추가</button>
    </form>

    <div class="filters" role="tablist">
      <button type="button" data-filter="all" class="active">전체</button>
      <button type="button" data-filter="todo">진행 전</button>
      <button type="button" data-filter="doing">진행 중</button>
      <button type="button" data-filter="done">완료</button>
      <button type="button" data-filter="important">★ 중요</button>
    </div>

    <div id="todo-list" class="todo-list"></div>
    <p id="empty" class="empty"></p>

    <footer class="footer">
      <span id="count"></span>
      <button type="button" id="clear-done">완료 항목 지우기</button>
    </footer>

    <p class="hint">팀원 모두가 같은 목록을 보고, 고친 내용은 바로 서로의 화면에 반영돼요.<br>작성하기: 상세 내용·자료 올리기 · 더블클릭: 제목 수정 · ⠿ 끌기: 순서 변경 · 그룹 제목 클릭: 접기/펼치기</p>
  </main>

  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail-inner">
      <header class="detail-head">
        <div class="detail-heading">
          <p id="detail-path" class="detail-path"></p>
          <h2 id="detail-title"></h2>
        </div>
        <button type="button" id="detail-close" class="detail-close" title="닫기">×</button>
      </header>

      <div class="detail-state">
        <span id="detail-status" class="status"></span>
        <label class="detail-done"><input type="checkbox" id="detail-done"> 완료로 표시</label>
      </div>

      <section class="detail-section">
        <label for="detail-notes" class="section-label">상세 내용</label>
        <textarea id="detail-notes" rows="8" placeholder="진행 상황, 메모, 참고 링크 등을 자유롭게 적어 보세요. 팀원 모두가 함께 봐요."></textarea>
        <p id="detail-saved" class="detail-saved"></p>
      </section>

      <section class="detail-section">
        <span class="section-label">최종 자료</span>
        <ul id="detail-files" class="detail-files"></ul>
        <div class="attach-actions write-only">
          <label class="upload-button" id="upload-label">
            파일 올리기
            <input type="file" id="detail-file-input" multiple>
          </label>
          <form id="link-form" class="link-form">
            <input id="link-url" type="url" placeholder="링크 주소 (예: 구글 드라이브 문서)" required>
            <input id="link-name" type="text" placeholder="이름 (선택)" maxlength="100">
            <button type="submit">링크 추가</button>
          </form>
          <p class="detail-hint">모든 파일을 올릴 수 있어요. PDF·이미지·동영상은 20MB, 한글·워드·엑셀·PPT 등 그 밖의 파일은 15MB까지예요. 더 큰 파일은 공유 드라이브 주소를 링크로 추가하세요.</p>
        </div>
        <p id="detail-file-error" class="detail-error" role="alert"></p>
      </section>
    </div>
  </dialog>

<script>
// 팀 공유용 할 일 목록
// claude.ai 아티팩트에서만 동작합니다. 할 일과 첨부는 아티팩트의 공유 저장소(db)에,
// 업로드한 파일은 아티팩트 자산(assets)에 저장되어 링크를 가진 팀원 모두가 함께 봅니다.
// 접힌 그룹, 선택한 필터처럼 개인 화면 설정만 브라우저(localStorage)에 남깁니다.

const COLLAPSED_KEY = 'team-collapsed-groups';
const IMPORTED_KEY = 'team-imported-local';
const STATUS_LABELS = { todo: '진행 전', doing: '진행 중', done: '완료' };

// 공유 저장소가 그대로 받아 주는 파일 형식 (확장자 → 형식). 이 파일들은 새 탭에서 바로 열림
const FILE_TYPES = {
  pdf: 'application/pdf',
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
  mp4: 'video/mp4', webm: 'video/webm',
  txt: 'text/plain', csv: 'text/csv', md: 'text/markdown', json: 'application/json',
};
const MAX_FILE_BYTES = 20 * 1024 * 1024;

// 그 밖의 파일(한글, 워드, 엑셀, PPT, zip 등)은 글자(base64)로 바꿔 텍스트 파일로 보관하고,
// 내려받을 때 원래 파일로 되돌림. 글자로 바꾸면 크기가 약 4/3배가 되어 원본은 15MB까지
const MAX_PACKED_BYTES = 15 * 1024 * 1024;

// 내려받기 창이 바로 저장해 주는 형식. 나머지(hwp, doc, xls, ppt 등)는 zip으로 감싸서 내려받음
const DIRECT_SAVE = new Set([
  'gif', 'png', 'jpg', 'jpeg', 'webp', 'mp4', 'webm', 'txt', 'json', 'md',
  'docx', 'pptx', 'epub', 'csv', 'pdf', 'xlsx', 'zip',
]);

const form = document.getElementById('todo-form');
const input = document.getElementById('todo-input');
const dueInput = document.getElementById('due-input');
const deptInput = document.getElementById('dept-input');
const teamInput = document.getElementById('team-input');
const deptOptions = document.getElementById('dept-options');
const teamOptions = document.getElementById('team-options');
const list = document.getElementById('todo-list');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const clearDone = document.getElementById('clear-done');
const filterButtons = document.querySelectorAll('.filters button');
const banner = document.getElementById('banner');
const importBox = document.getElementById('import-box');
const importText = document.getElementById('import-text');
const importButton = document.getElementById('import-button');
const importDismiss = document.getElementById('import-dismiss');

const detail = document.getElementById('detail');
const detailPath = document.getElementById('detail-path');
const detailTitle = document.getElementById('detail-title');
const detailStatus = document.getElementById('detail-status');
const detailNotes = document.getElementById('detail-notes');
const detailSaved = document.getElementById('detail-saved');
const detailFileInput = document.getElementById('detail-file-input');
const uploadLabel = document.getElementById('upload-label');
const detailFiles = document.getElementById('detail-files');
const detailFileError = document.getElementById('detail-file-error');
const detailDone = document.getElementById('detail-done');
const detailClose = document.getElementById('detail-close');
const linkForm = document.getElementById('link-form');
const linkUrl = document.getElementById('link-url');
const linkName = document.getElementById('link-name');

let db = null;
let assets = null;
let user = null;
let myId = null;
let canWrite = true;

let todos = [];
let attachments = [];
let loaded = false;
let filter = 'all';
let collapsed = loadCollapsed();
let openId = null;      // 작성하기 창에 열려 있는 할 일 id
let editing = false;    // 목록 안에서 무언가 수정 중이면 다시 그리기를 잠시 미룸
let pendingRender = false;
let notesTimer = null;
let names = {};         // 사람 id → 이름 (화면에 보여줄 때만 사용, 저장하지 않음)

// ───────── 시작 ─────────

render();
init();

async function init() {
  db = window.claude ? await window.claude.use('db') : null;
  if (!db) {
    loaded = true;
    setReadOnly(true);
    showBanner('공유 목록을 불러올 수 없어요. claude.ai에 로그인한 상태로 이 링크를 열어 주세요.');
    render();
    return;
  }

  [user, assets] = await Promise.all([window.claude.use('user'), window.claude.use('assets')]);
  if (user) {
    myId = await user.id();
    if ((await user.can('data.write')) === false) {
      setReadOnly(true);
      showBanner('보기 전용으로 열려 있어요. 함께 편집하려면 공유한 사람에게 편집 권한을 요청하세요.');
    }
  }
  if (!assets) uploadLabel.hidden = true;

  db.collection('todos').onSnapshot((snap) => {
    todos = snap.docs.map(d => normalize(d.id, d.data()));
    todos.sort((a, b) => a.order - b.order);
    loaded = true;
    render();
    updateDetail();
    offerImport();
  }, onDbError);

  db.collection('attachments').onSnapshot((snap) => {
    attachments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    attachments.sort((a, b) => a.addedAt - b.addedAt);
    render();
    updateDetail();
  }, onDbError);
}

function normalize(id, data) {
  return {
    id, dept: '', team: '', text: '', done: false, due: '', important: false, notes: '',
    order: 0, createdAt: 0, updatedAt: 0, updatedBy: null, ...data,
  };
}

function onDbError(e) {
  if (e && e.code === 'revoked') {
    setReadOnly(true);
    showBanner('이 페이지에 대한 접근 권한이 바뀌었어요. 새로고침해 주세요.');
  } else {
    showBanner('공유 목록 연결이 끊겼어요. 새로고침해 주세요.');
  }
}

function showBanner(message) {
  banner.textContent = message;
  banner.hidden = false;
}

function setReadOnly(on) {
  canWrite = !on;
  document.body.classList.toggle('readonly', on);
  detailNotes.readOnly = on;
  detailDone.disabled = on;
}

// ───────── 저장 (공유 저장소에 쓰기) ─────────

const queues = new Map(); // 같은 할 일에는 한 번에 하나씩만 쓰도록 줄 세움

function todoRef(id) {
  return db.collection('todos').doc(id);
}

function patch(id, fields) {
  if (!db || !canWrite) return Promise.resolve();
  const body = { ...fields, updatedAt: Date.now(), updatedBy: myId };
  const next = (queues.get(id) || Promise.resolve())
    .then(() => todoRef(id).update(body))
    .catch(onWriteError);
  queues.set(id, next);
  return next;
}

function onWriteError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') {
    setReadOnly(true);
    showBanner('이 목록을 수정할 권한이 없어요. 공유한 사람에게 편집 권한을 요청하세요.');
  } else if (code === 'quota_exceeded') {
    showBanner('공유 저장 공간이 가득 찼어요. 완료된 할 일을 정리한 뒤 다시 시도해 주세요.');
  } else {
    showBanner('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
  }
}

// ───────── 상태와 표시용 도우미 ─────────

function attachmentsOf(todoId) {
  return attachments.filter(a => a.todoId === todoId);
}

// 완료 체크 → 완료, 작성한 내용이나 첨부가 있으면 → 진행 중, 아무것도 없으면 → 진행 전
function statusOf(todo) {
  if (todo.done) return 'done';
  const notes = todo.id === openId ? detailNotes.value : todo.notes;
  if (notes.trim() || attachmentsOf(todo.id).length) return 'doing';
  return 'todo';
}

function today() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function describeDue(due) {
  if (!due) return { label: '+ 마감일', state: 'none' };
  const [, m, d] = due.split('-').map(Number);
  const diff = Math.round((new Date(due) - new Date(today())) / 86400000);
  if (diff < 0) return { label: `${m}/${d} (${-diff}일 지남)`, state: 'overdue' };
  if (diff === 0) return { label: '오늘까지', state: 'today' };
  if (diff === 1) return { label: '내일까지', state: 'soon' };
  return { label: `${m}/${d}까지 (D-${diff})`, state: 'soon' };
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

function formatTime(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 사람 이름 가져오기. 처음 보는 사람이면 불러온 뒤 창을 다시 그림
function nameOf(id) {
  if (!id) return '';
  if (id === myId) return '나';
  return names[id] || '팀원';
}

async function loadNames(ids) {
  if (!user) return;
  const missing = [...new Set(ids.filter(id => id && id !== myId && !(id in names)))];
  if (!missing.length) return;
  const found = await user.profiles(missing);
  for (const id of missing) names[id] = (found[id] && found[id].name) || '팀원';
  updateDetail();
}

// ───────── 목록 그리기 ─────────

function render() {
  if (editing) { pendingRender = true; return; }
  pendingRender = false;

  const visible = todos.filter(todo => {
    if (filter === 'todo' || filter === 'doing' || filter === 'done') return statusOf(todo) === filter;
    if (filter === 'important') return todo.important;
    return true;
  });

  list.innerHTML = '';

  const depts = new Map();
  const ungrouped = [];
  for (const todo of visible) {
    if (!todo.dept) { ungrouped.push(todo); continue; }
    if (!depts.has(todo.dept)) depts.set(todo.dept, { direct: [], teams: new Map() });
    const dept = depts.get(todo.dept);
    if (!todo.team) { dept.direct.push(todo); continue; }
    if (!dept.teams.has(todo.team)) dept.teams.set(todo.team, []);
    dept.teams.get(todo.team).push(todo);
  }

  for (const [deptName, dept] of depts) {
    const all = [...dept.direct, ...[...dept.teams.values()].flat()];
    const body = createGroup(list, 1, deptName, '', all);
    if (dept.direct.length) body.appendChild(createItemList(dept.direct));
    for (const [teamName, items] of dept.teams) {
      createGroup(body, 2, deptName, teamName, items).appendChild(createItemList(items));
    }
  }

  if (ungrouped.length) {
    const parent = depts.size ? createGroup(list, 1, '', '', ungrouped) : list;
    parent.appendChild(createItemList(ungrouped));
  }

  const tally = { todo: 0, doing: 0, done: 0 };
  for (const todo of todos) tally[statusOf(todo)]++;
  count.textContent = `진행 전 ${tally.todo} · 진행 중 ${tally.doing} · 완료 ${tally.done}`;

  if (!loaded) {
    empty.textContent = '공유 목록을 불러오는 중…';
  } else if (!todos.length) {
    empty.textContent = canWrite
      ? '아직 할 일이 없어요. 위에서 실(예: 회원관리)과 팀(예: 이용율 관리)을 적고 첫 할 일을 추가해 보세요.'
      : '아직 할 일이 없어요.';
  } else {
    empty.textContent = '이 조건에 맞는 할 일이 없어요.';
  }
  empty.hidden = visible.length > 0;
  clearDone.style.visibility = canWrite && todos.some(t => t.done) ? 'visible' : 'hidden';
  updateSuggestions();
}

function createGroup(parent, level, dept, team, items) {
  const key = team ? `${dept}/${team}` : dept || '__none__';
  const name = level === 2 ? team : dept || '그룹 없음';

  const section = document.createElement('section');
  section.className = `group lv${level}`;
  if (collapsed.has(key)) section.classList.add('collapsed');

  const head = document.createElement('div');
  head.className = 'group-head';

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'group-toggle';
  toggle.setAttribute('aria-expanded', String(!collapsed.has(key)));
  const left = items.filter(t => !t.done).length;
  toggle.innerHTML = '<span class="caret">▾</span><span class="tag"></span><span class="name"></span><span class="group-count"></span>';
  toggle.querySelector('.tag').textContent = level === 1 ? '실' : '팀';
  toggle.querySelector('.name').textContent = name;
  toggle.querySelector('.group-count').textContent = `${left}/${items.length}`;
  if (!dept) toggle.querySelector('.tag').remove();
  toggle.addEventListener('click', () => {
    if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
    saveCollapsed();
    render();
  });
  head.appendChild(toggle);

  if (dept && canWrite) {
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'group-action';
    add.title = `'${name}'에 할 일 추가`;
    add.textContent = '＋';
    add.addEventListener('click', () => {
      deptInput.value = dept;
      teamInput.value = team;
      syncTeamInput();
      input.focus();
    });

    const rename = document.createElement('button');
    rename.type = 'button';
    rename.className = 'group-action';
    rename.title = '그룹 이름 바꾸기';
    rename.textContent = '✎';
    rename.addEventListener('click', () => startRename(head, toggle, dept, team));

    head.append(add, rename);
  }

  const body = document.createElement('div');
  body.className = 'group-body';
  section.append(head, body);
  parent.appendChild(section);
  return body;
}

function createItemList(items) {
  const ul = document.createElement('ul');
  for (const todo of items) ul.appendChild(createItem(todo));
  return ul;
}

function createItem(todo) {
  const li = document.createElement('li');
  li.dataset.id = todo.id;
  if (todo.done) li.classList.add('done');
  if (todo.important) li.classList.add('important');

  const handle = document.createElement('span');
  handle.className = 'handle write-only';
  handle.title = '끌어서 순서 바꾸기';
  handle.textContent = '⠿';
  handle.addEventListener('pointerdown', (e) => startDrag(e, li));

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = todo.done;
  checkbox.disabled = !canWrite;
  checkbox.addEventListener('change', () => patch(todo.id, { done: checkbox.checked }));

  const body = document.createElement('div');
  body.className = 'item-body';

  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = todo.text;
  text.addEventListener('dblclick', () => { if (canWrite) startEdit(text, todo); });

  const meta = document.createElement('div');
  meta.className = 'meta';

  const status = statusOf(todo);
  const pill = document.createElement('span');
  pill.className = `status ${status}`;
  pill.textContent = STATUS_LABELS[status];
  meta.appendChild(pill);

  const { label, state } = describeDue(todo.due);
  if (state !== 'none' || canWrite) {
    const due = document.createElement('button');
    due.type = 'button';
    due.className = 'due';
    if (state === 'none') due.classList.add('empty-due');
    if (state === 'today') due.classList.add('today');
    if (state === 'overdue') due.classList.add('overdue');
    due.title = '마감일 바꾸기';
    due.textContent = label;
    due.disabled = !canWrite;
    due.addEventListener('click', () => startDueEdit(due, todo));
    meta.appendChild(due);
  }

  const attachCount = attachmentsOf(todo.id).length;
  if (attachCount) {
    const clip = document.createElement('span');
    clip.className = 'clip';
    clip.title = '첨부';
    clip.textContent = `📎 ${attachCount}`;
    meta.appendChild(clip);
  }

  body.append(text, meta);

  const write = document.createElement('button');
  write.type = 'button';
  write.className = 'write';
  write.textContent = canWrite ? '작성하기' : '보기';
  write.addEventListener('click', () => openDetail(todo.id));

  const star = document.createElement('button');
  star.type = 'button';
  star.className = 'star';
  star.title = todo.important ? '중요 해제' : '중요 표시';
  star.textContent = todo.important ? '★' : '☆';
  star.disabled = !canWrite;
  star.addEventListener('click', () => patch(todo.id, { important: !todo.important }));

  const del = document.createElement('button');
  del.className = 'delete write-only';
  del.type = 'button';
  del.title = '삭제';
  del.textContent = '×';
  del.addEventListener('click', () => askDelete(li, [todo]));

  li.append(handle, checkbox, body, write, star, del);
  return li;
}

// 여럿이 함께 쓰는 목록이라 지우기 전에 한 번 더 물어봄
function askDelete(li, targets) {
  const bar = document.createElement('div');
  bar.className = 'confirm-bar';
  const msg = document.createElement('span');
  msg.textContent = '이 할 일과 첨부를 모두 지울까요? 팀원 화면에서도 사라져요.';
  const yes = document.createElement('button');
  yes.type = 'button';
  yes.className = 'confirm-yes';
  yes.textContent = '지우기';
  const no = document.createElement('button');
  no.type = 'button';
  no.textContent = '취소';
  bar.append(msg, yes, no);
  li.after(bar);
  editing = true;
  const done = () => { bar.remove(); editing = false; render(); };
  yes.addEventListener('click', () => { removeTodos(targets); done(); });
  no.addEventListener('click', done);
  no.focus();
}

async function removeTodos(targets) {
  if (!canWrite) return;
  for (const todo of targets) {
    for (const att of attachmentsOf(todo.id)) await removeAttachment(att);
    await todoRef(todo.id).delete().catch(onWriteError);
  }
}

// ───────── 목록 안에서 바로 고치기 ─────────

function startEdit(text, todo) {
  const edit = document.createElement('input');
  edit.className = 'edit';
  edit.value = todo.text;
  edit.maxLength = 200;
  text.replaceWith(edit);
  editing = true;
  edit.focus();

  let finished = false;
  const finish = (commit) => {
    if (finished) return;
    finished = true;
    editing = false;
    const value = edit.value.trim();
    if (commit && value && value !== todo.text) patch(todo.id, { text: value });
    render();
  };
  edit.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  edit.addEventListener('blur', () => finish(true));
}

function startDueEdit(badge, todo) {
  const edit = document.createElement('input');
  edit.type = 'date';
  edit.className = 'due-edit';
  edit.value = todo.due;
  badge.replaceWith(edit);
  editing = true;
  edit.focus();
  try { edit.showPicker(); } catch { /* 지원하지 않는 브라우저 */ }

  let finished = false;
  const finish = (commit) => {
    if (finished) return;
    finished = true;
    editing = false;
    if (commit && edit.value !== todo.due) patch(todo.id, { due: edit.value });
    render();
  };
  edit.addEventListener('change', () => finish(true));
  edit.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  edit.addEventListener('blur', () => finish(true));
}

function startRename(head, toggle, dept, team) {
  const edit = document.createElement('input');
  edit.className = 'rename-input';
  edit.value = team || dept;
  edit.maxLength = 40;
  head.replaceChild(edit, toggle);
  editing = true;
  edit.focus();
  edit.select();

  let finished = false;
  const finish = (commit) => {
    if (finished) return;
    finished = true;
    editing = false;
    const value = edit.value.trim();
    if (commit && value && value !== (team || dept)) {
      for (const todo of todos) {
        if (todo.dept !== dept) continue;
        if (team && todo.team === team) patch(todo.id, { team: value });
        if (!team) patch(todo.id, { dept: value });
      }
    }
    render();
  };
  edit.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  edit.addEventListener('blur', () => finish(true));
}

// ⠿ 손잡이를 끌어서 같은 그룹 안에서 순서 바꾸기
function startDrag(e, li) {
  if (!canWrite) return;
  e.preventDefault();
  editing = true;
  li.classList.add('dragging');
  document.body.classList.add('is-dragging');

  const onMove = (ev) => {
    const container = li.parentElement;
    const siblings = [...container.children].filter(el => el !== li);
    const next = siblings.find(el => {
      const box = el.getBoundingClientRect();
      return ev.clientY < box.top + box.height / 2;
    });
    if (next) {
      if (li.nextElementSibling !== next) container.insertBefore(li, next);
    } else if (container.lastElementChild !== li) {
      container.appendChild(li);
    }
  };

  const onUp = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    document.body.classList.remove('is-dragging');
    li.classList.remove('dragging');
    editing = false;
    moveBetweenNeighbours(li);
    render();
  };

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

// 옮긴 항목 하나만 앞뒤 항목 사이의 순서 값으로 바꿈 (다른 팀원의 순서는 건드리지 않음)
function moveBetweenNeighbours(li) {
  const byId = id => todos.find(t => t.id === id);
  const todo = byId(li.dataset.id);
  const prev = li.previousElementSibling && byId(li.previousElementSibling.dataset.id);
  const next = li.nextElementSibling && byId(li.nextElementSibling.dataset.id);
  if (!todo || (!prev && !next)) return;
  let order;
  if (prev && next) order = (prev.order + next.order) / 2;
  else if (prev) order = prev.order + 1000;
  else order = next.order - 1000;
  if (order === todo.order) return;
  todo.order = order;
  todos.sort((a, b) => a.order - b.order);
  patch(todo.id, { order });
}

// ───────── 입력칸 ─────────

function updateSuggestions() {
  const depts = [...new Set(todos.map(t => t.dept).filter(Boolean))];
  const teams = [...new Set(todos.filter(t => t.dept === deptInput.value.trim()).map(t => t.team).filter(Boolean))];
  fillOptions(deptOptions, depts);
  fillOptions(teamOptions, teams);
}

function fillOptions(datalist, values) {
  datalist.innerHTML = '';
  for (const value of values) {
    const option = document.createElement('option');
    option.value = value;
    datalist.appendChild(option);
  }
}

function syncTeamInput() {
  const hasDept = deptInput.value.trim() !== '';
  teamInput.disabled = !hasDept;
  if (!hasDept) teamInput.value = '';
  updateSuggestions();
}

function nextOrder() {
  return todos.length ? Math.max(...todos.map(t => t.order)) + 1000 : 1000;
}

function addTodo(fields) {
  const now = Date.now();
  return db.collection('todos').doc().set({
    dept: '', team: '', text: '', done: false, due: '', important: false, notes: '',
    order: nextOrder(), createdAt: now, createdBy: myId, updatedAt: now, updatedBy: myId,
    ...fields,
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (!db || !canWrite) return;
  const text = input.value.trim();
  if (!text) return;
  const dept = deptInput.value.trim();
  const team = dept ? teamInput.value.trim() : '';
  addTodo({ dept, team, text, due: dueInput.value }).catch(onWriteError);
  input.value = '';
  dueInput.value = '';
});

deptInput.addEventListener('input', syncTeamInput);

filterButtons.forEach(button => {
  button.addEventListener('click', () => {
    filter = button.dataset.filter;
    filterButtons.forEach(b => b.classList.toggle('active', b === button));
    render();
  });
});

clearDone.addEventListener('click', () => {
  const done = todos.filter(t => t.done);
  if (!done.length) return;
  const bar = document.createElement('div');
  bar.className = 'confirm-bar';
  bar.innerHTML = '<span></span><button type="button" class="confirm-yes">지우기</button><button type="button">취소</button>';
  bar.querySelector('span').textContent = `완료된 할 일 ${done.length}개와 첨부를 모두 지울까요? 팀원 화면에서도 사라져요.`;
  list.after(bar);
  const [yes, no] = bar.querySelectorAll('button');
  yes.addEventListener('click', () => { removeTodos(done); bar.remove(); });
  no.addEventListener('click', () => bar.remove());
  no.focus();
});

// ───────── 작성하기 창 ─────────

function openTodo() {
  return todos.find(t => t.id === openId) || null;
}

function openDetail(id) {
  const todo = todos.find(t => t.id === id);
  if (!todo) return;
  openId = id;
  detailNotes.value = todo.notes;
  detailFileError.textContent = '';
  linkUrl.value = '';
  linkName.value = '';
  updateDetail();
  detail.showModal();
  if (canWrite && !todo.notes) detailNotes.focus();
}

function updateDetail() {
  const todo = openTodo();
  if (!todo) {
    if (openId && detail.open && loaded) detail.close(); // 다른 팀원이 지운 경우
    return;
  }
  detailPath.textContent = [todo.dept, todo.team].filter(Boolean).join(' › ') || '그룹 없음';
  detailTitle.textContent = todo.text;
  detailDone.checked = todo.done;

  // 내가 입력 중일 때는 덮어쓰지 않음. 그 외에는 팀원이 고친 내용을 바로 반영
  if (document.activeElement !== detailNotes && !notesTimer) detailNotes.value = todo.notes;

  const status = statusOf(todo);
  detailStatus.className = `status ${status}`;
  detailStatus.textContent = STATUS_LABELS[status];

  if (notesTimer) {
    detailSaved.textContent = '저장 중…';
  } else if (todo.updatedAt) {
    detailSaved.textContent = `마지막 수정: ${nameOf(todo.updatedBy) || '팀원'} · ${formatTime(todo.updatedAt)}`;
  } else {
    detailSaved.textContent = '';
  }

  const items = attachmentsOf(todo.id);
  loadNames([todo.updatedBy, ...items.map(a => a.by)]);

  detailFiles.innerHTML = '';
  for (const att of items) {
    const li = document.createElement('li');

    const icon = document.createElement('span');
    icon.className = 'file-icon';
    icon.textContent = att.kind === 'link' ? '🔗' : '📄';

    let a;
    if (att.packed) {
      // 글자로 바꿔 보관한 파일: 눌러서 원래 파일로 내려받음
      a = document.createElement('button');
      a.type = 'button';
      a.title = '내려받기';
      a.addEventListener('click', () => downloadPacked(att, a));
    } else {
      a = document.createElement('a');
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.href = att.kind === 'link' ? safeUrl(att.url) : `/_blob/${att.asset}`;
      a.title = att.kind === 'link' ? att.url : '새 탭에서 열기';
    }
    a.className = 'file-name';
    a.textContent = att.name;

    const info = document.createElement('span');
    info.className = 'file-info';
    const size = att.kind === 'file' ? `${formatSize(att.size)} · ` : '';
    info.textContent = `${size}${nameOf(att.by) || '팀원'} · ${formatTime(att.addedAt)}`;

    li.append(icon, a, info);
    if (canWrite) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'file-delete';
      del.title = '첨부 삭제';
      del.textContent = '×';
      del.addEventListener('click', () => removeAttachment(att));
      li.appendChild(del);
    }
    detailFiles.appendChild(li);
  }
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'no-files';
    li.textContent = '아직 올린 자료가 없어요.';
    detailFiles.appendChild(li);
  }
}

// http/https 주소만 링크로 연결
function safeUrl(url) {
  try {
    const u = new URL(url);
    return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : '#';
  } catch {
    return '#';
  }
}

// 상세 내용: 입력을 잠깐 멈추면 저장
detailNotes.addEventListener('input', () => {
  if (!openId || !canWrite) return;
  clearTimeout(notesTimer);
  notesTimer = setTimeout(flushNotes, 700);
  updateDetail();
  render();
});

function flushNotes() {
  clearTimeout(notesTimer);
  notesTimer = null;
  const todo = openTodo();
  if (!todo || !canWrite) return;
  if (detailNotes.value !== todo.notes) patch(todo.id, { notes: detailNotes.value });
  updateDetail();
}

detailDone.addEventListener('change', () => {
  if (openId) patch(openId, { done: detailDone.checked });
});

// 파일 올리기
detailFileInput.addEventListener('change', async () => {
  const todoId = openId;
  const picked = [...detailFileInput.files];
  detailFileInput.value = '';
  if (!todoId || !picked.length || !assets) return;
  detailFileError.textContent = '';
  uploadLabel.classList.add('busy');

  for (const file of picked) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const type = FILE_TYPES[ext];
    const packed = !type;
    const limit = packed ? MAX_PACKED_BYTES : MAX_FILE_BYTES;
    if (file.size > limit) {
      detailFileError.textContent = `'${file.name}'이(가) ${limit / 1024 / 1024}MB보다 커요. 크기를 줄이거나 공유 드라이브 주소를 링크로 추가해 주세요.`;
      continue;
    }
    if (!file.size) {
      detailFileError.textContent = `'${file.name}'은(는) 빈 파일이라 올릴 수 없어요.`;
      continue;
    }
    try {
      const res = packed
        ? await assets.upload(new Blob([await toBase64(file)], { type: 'text/plain' }), { type: 'text/plain' })
        : await assets.upload(file, { type });
      await db.collection('attachments').doc().set({
        todoId, kind: 'file', asset: res.id, name: file.name, size: file.size, packed,
        addedAt: Date.now(), by: myId,
      });
      patch(todoId, {});
    } catch (err) {
      detailFileError.textContent = uploadErrorMessage(file.name, err && err.code);
    }
  }
  uploadLabel.classList.remove('busy');
});

// 파일 → base64 글자
function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// base64 글자 → 원래 파일 내용
function fromBase64(text) {
  const bin = atob(text.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function downloadPacked(att, button) {
  detailFileError.textContent = '';
  const downloads = window.claude ? await window.claude.use('downloads') : null;
  if (!downloads) {
    detailFileError.textContent = '이 화면에서는 내려받을 수 없어요. claude.ai에서 링크를 열어 주세요.';
    return;
  }
  button.disabled = true;
  try {
    const res = await fetch(`/_blob/${att.asset}`);
    if (!res.ok) throw new Error('missing');
    const bytes = fromBase64(await res.text());
    const ext = (att.name.split('.').pop() || '').toLowerCase();
    const direct = DIRECT_SAVE.has(ext);
    await downloads.save(direct
      ? { filename: att.name, data: new Blob([bytes]) }
      : { filename: `${att.name}.zip`, data: makeZip(att.name, bytes) });
    if (!direct) detailFileError.textContent = `'${att.name}'은(는) zip 파일로 저장돼요. 압축을 풀면 원래 파일이 나와요.`;
  } catch (err) {
    const code = err && err.code;
    if (code === 'declined') {
      // 내려받기 창에서 취소함
    } else if (code === 'rate_limited') {
      detailFileError.textContent = '잠시 후 다시 눌러 주세요.';
    } else {
      detailFileError.textContent = `'${att.name}'을(를) 내려받지 못했어요. 잠시 후 다시 시도해 주세요.`;
    }
  } finally {
    button.disabled = false;
  }
}

// 파일 하나를 압축 없이 담은 zip 만들기 (한글 파일 이름 지원)
function makeZip(name, bytes) {
  const nameBytes = new TextEncoder().encode(name);
  const crc = crc32(bytes);
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

  const local = new DataView(new ArrayBuffer(30));
  local.setUint32(0, 0x04034b50, true);
  local.setUint16(4, 20, true);
  local.setUint16(6, 0x0800, true); // 파일 이름이 UTF-8
  local.setUint16(10, time, true);
  local.setUint16(12, date, true);
  local.setUint32(14, crc, true);
  local.setUint32(18, bytes.length, true);
  local.setUint32(22, bytes.length, true);
  local.setUint16(26, nameBytes.length, true);

  const central = new DataView(new ArrayBuffer(46));
  central.setUint32(0, 0x02014b50, true);
  central.setUint16(4, 20, true);
  central.setUint16(6, 20, true);
  central.setUint16(8, 0x0800, true);
  central.setUint16(12, time, true);
  central.setUint16(14, date, true);
  central.setUint32(16, crc, true);
  central.setUint32(20, bytes.length, true);
  central.setUint32(24, bytes.length, true);
  central.setUint16(28, nameBytes.length, true);

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, 1, true);
  end.setUint16(10, 1, true);
  end.setUint32(12, 46 + nameBytes.length, true);
  end.setUint32(16, 30 + nameBytes.length + bytes.length, true);

  return new Blob([local, nameBytes, bytes, central, nameBytes, end], { type: 'application/zip' });
}

let crcTable = null;
function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      crcTable[i] = c >>> 0;
    }
  }
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

function uploadErrorMessage(name, code) {
  if (code === 'invalid_request') return `'${name}'을(를) 올리지 못했어요. txt·csv 파일은 UTF-8로 저장된 파일만 올릴 수 있어요.`;
  if (code === 'too_large') return `'${name}'이(가) 너무 커요. 크기를 줄이거나 링크로 추가해 주세요.`;
  if (code === 'unsupported_type') return `'${name}'은(는) 올릴 수 없는 형식이에요.`;
  if (code === 'quota_or_state') return '공유 저장 공간이 가득 찼어요. 필요 없는 첨부를 지운 뒤 다시 시도해 주세요.';
  if (code === 'rate_limited') return '잠시 후 다시 올려 주세요.';
  return `'${name}'을(를) 올리지 못했어요. 잠시 후 다시 시도해 주세요.`;
}

// 링크 추가 (구글 드라이브, 원드라이브, 노션 등)
linkForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const todoId = openId;
  if (!todoId || !canWrite) return;
  const url = linkUrl.value.trim();
  if (safeUrl(url) === '#') {
    detailFileError.textContent = 'http:// 또는 https://로 시작하는 주소를 넣어 주세요.';
    return;
  }
  detailFileError.textContent = '';
  const name = linkName.value.trim() || new URL(url).hostname;
  db.collection('attachments').doc().set({ todoId, kind: 'link', url, name, addedAt: Date.now(), by: myId })
    .then(() => patch(todoId, {}))
    .catch(onWriteError);
  linkUrl.value = '';
  linkName.value = '';
});

async function removeAttachment(att) {
  if (!canWrite) return;
  if (att.kind === 'file' && assets) {
    // 다른 팀원이 올린 파일은 지울 권한이 없을 수 있음. 그래도 목록에서는 뺌
    await assets.delete(att.asset).catch(() => {});
  }
  await db.collection('attachments').doc(att.id).delete().catch(onWriteError);
  if (att.todoId === openId) patch(att.todoId, {});
}

detailClose.addEventListener('click', () => detail.close());
detail.addEventListener('click', (e) => { if (e.target === detail) detail.close(); });
detail.addEventListener('close', () => {
  if (notesTimer) flushNotes();
  openId = null;
  render();
});

// ───────── 개인 화면 설정 ─────────

function loadCollapsed() {
  try {
    return new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY)) || []);
  } catch {
    return new Set();
  }
}

function saveCollapsed() {
  try {
    localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...collapsed]));
  } catch {
    // 무시
  }
}

// ───────── 예전 개인용 목록 옮기기 ─────────
// 이 페이지가 개인용이던 때 이 브라우저에 적어 둔 할 일이 있으면 공유 목록으로 옮길 수 있게 함

function localTodos() {
  try {
    if (localStorage.getItem(IMPORTED_KEY)) return [];
    const saved = JSON.parse(localStorage.getItem('todos')) || [];
    return saved.filter(t => t && t.text && !String(t.text).startsWith('(예시)'));
  } catch {
    return [];
  }
}

function offerImport() {
  if (!canWrite || !importBox.hidden) return;
  const items = localTodos();
  if (!items.length) return;
  importText.textContent = `이 브라우저에 개인용으로 적어 둔 할 일 ${items.length}개가 있어요. 공유 목록으로 옮길까요? (상세 내용은 옮겨지고, 올렸던 파일은 다시 올려야 해요)`;
  importBox.hidden = false;
}

function markImported() {
  try { localStorage.setItem(IMPORTED_KEY, '1'); } catch { /* 무시 */ }
  importBox.hidden = true;
}

importButton.addEventListener('click', async () => {
  const items = localTodos();
  markImported();
  let order = nextOrder();
  for (const t of items) {
    await addTodo({
      dept: t.dept || '', team: t.team || '', text: String(t.text).slice(0, 200), done: !!t.done,
      due: t.due || '', important: !!t.important, notes: t.notes || '', order,
    }).catch(onWriteError);
    order += 1000;
  }
});

importDismiss.addEventListener('click', markImported);

syncTeamInput();
